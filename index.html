F<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>國立中央大學公共工程品質管理模擬測驗系統</title>

<style>

body{
    margin:0;
    padding:15px;
    background:#f4f6f9;
    font-family:"Microsoft JhengHei",sans-serif;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
    color:#1565c0;
    margin-top:0;
}

.info{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    font-weight:bold;
}

.option{
    border:1px solid #ddd;
    border-radius:8px;
    padding:18px;
    margin:12px 0;
    cursor:pointer;
    font-size:18px;
    line-height:1.8;
}
.option label{
    display:block;
    width:100%;
    cursor:pointer;
}
.option input[type=radio]{
    transform:scale(1.5);
    margin-right:10px;
}


.option:hover{
    background:#f5faff;
}

button{
    border:none;
    padding:12px 18px;
    border-radius:6px;
    cursor:pointer;
    margin:4px;
}

.btn-primary{
    background:#1976d2;
    color:white;
}

.btn-success{
    background:#2e7d32;
    color:white;
}

.btn-danger{
    background:#d32f2f;
    color:white;
}

.wrong{
    background:#ffffff;
    border:1px solid #ddd;
    color:#c00000;
    padding:10px;
    border-radius:6px;
}

#result{
    display:none;
}
.wrong-card{
    background:#fff;
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    margin:15px 0;
}

.wrong-answer{
    background:#ffeaea;
    color:#c00000;
    padding:10px;
    border-radius:6px;
    margin-top:10px;
}

.correct-answer{
    background:#e8fff0;
    color:#008000;
    padding:10px;
    border-radius:6px;
    margin-top:10px;
}
@media(max-width:768px){

.info{
    flex-direction:column;
    gap:10px;
}

button{
    width:100%;
}

}

</style>

</head>
<body>

<div class="container">

<div class="card">

<h1>國立中央大學公共工程品質管理模擬測驗</h1>
<p style="color:#666;font-size:18px;">
公共工程品質管理訓練班(土建)
模擬測驗系統</p>
<p>
100題 ｜ 90分鐘 ｜ 60分及格
</p>

<div class="info">
<div>剩餘時間：<span id="timer">01:30:00</span></div>
<div>已作答：<span id="answered">0</span>/100</div>
<div>題號：<span id="qno">1</span>/100</div>
</div>

</div>

<div id="examArea" class="card">

<h2 id="question"></h2>

<div id="options"></div>

<div>

<button class="btn-primary"
onclick="prevQuestion()">
上一題
</button>

<button class="btn-primary"
onclick="nextQuestion()">
下一題
</button>

<button class="btn-danger"
onclick="submitExam()">
交卷
</button>

</div>

</div>

<div id="result" class="card"></div>

</div>

<script>

let questionBank=[];
let examQuestions=[];
let answers=[];
let current=0;

//=================================

function shuffle(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[array[i],array[j]]=
[array[j],array[i]];
}

return array;

}

//=================================

function parseQuestion(text){

const regex=
/(.*)\(A\)(.*?)\(B\)(.*?)\(C\)(.*?)\(D\)(.*)/s;

const m=text.match(regex);

if(!m) return null;

return{

question:m[1].trim(),

A:m[2].trim(),

B:m[3].trim(),

C:m[4].trim(),

D:m[5].trim()

};

}

function downloadReview(){

    let resultText = "";

    examQuestions.forEach((q,i)=>{

        resultText += `
================================

第 ${i+1} 題

題目：
${q.q}

A. ${q.A}
B. ${q.B}
C. ${q.C}
D. ${q.D}

您的答案：
${answers[i]
? answers[i] + ". " + q[answers[i]]
: "未作答"}

正確答案：
${q.answer}. ${q[q.answer]}

`;
    });

    const blob =
        new Blob(
            [resultText],
            {
                type:"text/plain;charset=utf-8"
            }
        );

    const a =
        document.createElement("a");

    a.href =
        URL.createObjectURL(blob);

    a.download =
        "模擬測驗結果.txt";

    a.click();
}    

//=================================

async function loadQuestions(){

    const response = await fetch("questions.csv");
    const csv = await response.text();

    const rows = csv.split(/\r?\n/);

    questionBank = [];

    for(let i=1;i<rows.length;i++){

        const row = rows[i].trim();

        if(!row) continue;

        const cols = row.split(",");

        if(cols.length < 5) continue;

        const answer =
            cols[cols.length-1].trim();

        const questionText =
            cols.slice(2, cols.length-2)
            .join(",");

        const p = parseQuestion(questionText);

        if(!p) continue;

        questionBank.push({
            q:p.question,
            A:p.A,
            B:p.B,
            C:p.C,
            D:p.D,
            answer:answer
        });
    }

    console.log(
        "題庫載入完成：",
        questionBank.length
    );

    examQuestions =
        shuffle([...questionBank])
        .slice(0,100);

    answers =
        new Array(100).fill(null);

    renderQuestion();
}

//=================================

function renderQuestion(){

const q=
examQuestions[current];

document.getElementById("qno").innerText=
current+1;

document.getElementById("question").innerText=
(current+1)+". "+q.q;

let html="";

["A","B","C","D"]
.forEach(opt=>{

html+=`
<div class="option">

<label>

<input
type="radio"
name="answer"
value="${opt}"

${answers[current]===opt
?"checked":""
}

onchange="saveAnswer('${opt}')">

${opt}. ${q[opt]}

</label>

</div>
`;

});

document.getElementById("options")
.innerHTML=html;

updateCounter();

}

//=================================

function saveAnswer(ans){

answers[current]=ans;

updateCounter();

}

function updateCounter(){

document.getElementById("answered")
.innerText=
answers.filter(
x=>x!==null
).length;

}

//=================================

function nextQuestion(){

if(current<99){

current++;

renderQuestion();

}

}

function prevQuestion(){

if(current>0){

current--;

renderQuestion();

}

}

//=================================

let remain=
90*60;

function updateTimer(){

const h=
Math.floor(remain/3600);

const m=
Math.floor(
(remain%3600)/60
);

const s=
remain%60;

document.getElementById("timer")
.innerText=

`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;

}

updateTimer();

const timer=
setInterval(()=>{

remain--;

updateTimer();

if(remain<=0){

clearInterval(timer);

alert("測驗時間到，自動交卷");

submitExam();

}

},1000);

//=================================

function submitExam(){
    const confirmSubmit = confirm(
        "確定要交卷嗎？\n\n交卷後將無法再修改答案。"
        );
    if(!confirmSubmit){
        return;
        }
    
clearInterval(timer);

let score=0;

let review="";

examQuestions.forEach((q,i)=>{

const userAns = answers[i];

const isCorrect =
    userAns === q.answer;

if(isCorrect){
    score++;
}

review += `

<div class="wrong-card">

    <h3>
        ${isCorrect ? "✅" : "❌"}
        第 ${i+1} 題
    </h3>

    <p>
        <strong>題目：</strong>
        ${q.q}
    </p>

    <div class="wrong-answer">
        <strong>您的答案：</strong>
        ${
            userAns
            ? `${userAns}. ${q[userAns]}`
            : "未作答"
        }
    </div>

    <div class="correct-answer">
        <strong>正確答案：</strong>
        ${q.answer}. ${q[q.answer]}
    </div>

</div>

`;



review += `
<div class="wrong-card">

<h3>❌ 第 ${i+1} 題</h3>

<p><strong>題目：</strong>${q.q}</p>

<div class="wrong-answer">
<strong>您的答案：</strong>
${userAns? `${userAns}. ${q[userAns]}`: "未作答"}
</div>

<div class="correct-answer">
<strong>正確答案：</strong>
${q.answer}. ${q[q.answer]}
</div>

</div>
`;

}

});

document.getElementById("result")
.innerHTML=`

<h2>測驗完成</h2>

<h1>${score} 分</h1>

<h2 style="
color:${score>=60?'green':'red'};
">

${score>=60?'✅及格':'❌不及格'}

</h2>

<p>答對：${score} 題</p>

<p>答錯：${100-score} 題</p>

<hr>

<h3>完整試卷與答案</h3>

${review}

<button
class="btn-primary"
onclick="downloadReview()">
📥下載完整考卷
</button>

<button
class="btn-success"
onclick="location.reload()">
重新測驗
</button>

`;

document.getElementById("examArea")
.style.display="none";

document.getElementById("result")
.style.display="block";

window.scrollTo(0,0);

}

//=================================

loadQuestions();

</script>

</body>
</html>
