<script>

let questionBank = [];
let examQuestions = [];
let current = 0;
let answers = [];

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
    return array;
}

function parseQuestion(text){

    const regex =
    /(.*)\(A\)(.*?)\(B\)(.*?)\(C\)(.*?)\(D\)(.*)/s;

    const match = text.match(regex);

    if(!match) return null;

    return {
        question: match[1].trim(),
        A: match[2].trim(),
        B: match[3].trim(),
        C: match[4].trim(),
        D: match[5].trim()
    };
}

async function loadQuestions(){

    const response = await fetch("questions.csv");
    const text = await response.text();

    const rows = text.split(/\r?\n/);

    questionBank = [];

    for(let i=1;i<rows.length;i++){

        const row = rows[i];

        if(!row || row.trim()==="") continue;

        const firstComma = row.indexOf(",");
        const secondComma = row.indexOf(",", firstComma+1);
        const lastComma = row.lastIndexOf(",");
        const secondLastComma = row.lastIndexOf(",", lastComma-1);

        if(firstComma < 0 ||
           secondComma < 0 ||
           secondLastComma < 0) continue;

        const category =
             row.substring(firstComma+1,secondComma).trim();

        const questionText =
             row.substring(secondComma+1,secondLastComma).trim();

        const answer =
             row.substring(lastComma+1).trim();

        const parsed =
             parseQuestion(questionText);

        if(!parsed) continue;

        questionBank.push({
            category,
            q: parsed.question,
            A: parsed.A,
            B: parsed.B,
            C: parsed.C,
            D: parsed.D,
            answer
        });
    }

    examQuestions =
        shuffle([...questionBank]).slice(0,100);

    answers =
        new Array(examQuestions.length).fill(null);

    renderQuestion();
}

function renderQuestion(){

    const q = examQuestions[current];

    document.getElementById("qno").innerText =
        current + 1;

    document.getElementById("question").innerText =
        (current+1)+". "+q.q;

    let html = "";

    ["A","B","C","D"].forEach(opt=>{

        html += `
        <div class="option">
        <label>
        <input type="radio"
            name="ans"
            value="${opt}"
            ${answers[current]===opt?"checked":""}
            onchange="saveAnswer('${opt}')">
        ${opt}. ${q[opt]}
        </label>
        </div>
        `;
    });

    document.getElementById("options").innerHTML=
        html;

    updateCount();
}

function saveAnswer(ans){
    answers[current]=ans;
    updateCount();
}

function updateCount(){

    const count=
      answers.filter(a=>a!==null).length;

    document.getElementById("answered").innerText=
      count;
}

function nextQuestion(){

    if(current<99){
        current++;
        renderQuestion();
    }
}

function prevQuestion(){

    if(current>0){
        current--;
        renderQuestion();
    }
}

let remain = 90 * 60;

function updateTimer(){

    const h =
       Math.floor(remain/3600);

    const m =
       Math.floor((remain%3600)/60);

    const s =
       remain%60;

    document.getElementById("timer").innerText=
        `${String(h).padStart(2,"0")}:`+
        `${String(m).padStart(2,"0")}:`+
        `${String(s).padStart(2,"0")}`;
}

updateTimer();

const timer = setInterval(()=>{

    remain--;

    updateTimer();

    if(remain<=0){

        clearInterval(timer);

        alert("時間到，自動交卷");

        submitExam();
    }

},1000);

function submitExam(){

    clearInterval(timer);

    let score = 0;
    let review = "";

    examQuestions.forEach((q,i)=>{

        if(answers[i]===q.answer){

            score++;

        }else{

            review += `
            <div class="wrong">
            <b>第 ${i+1} 題</b><br><br>

            ${q.q}<br><br>

            您的答案：
            ${answers[i] || "未作答"}<br>

            正確答案：
            <b>${q.answer}</b>

            </div>
            `;
        }

    });

    const result = `
    <h2>測驗完成</h2>

    <h1>${score} 分</h1>

    <h2 style="color:${score>=60?'green':'red'}">

    ${score>=60?'✅及格':'❌不及格'}

    </h2>

    <p>答對：${score} 題</p>

    <p>答錯：${100-score} 題</p>

    <hr>

    <h3>錯題複習</h3>

    ${review}
    `;

    document.getElementById("result").innerHTML =
        result;

    document.getElementById("result").style.display =
        "block";

    document.getElementById("examArea").style.display =
        "none";

    window.scrollTo(0,0);
}

window.onload = loadQuestions;

</script>
